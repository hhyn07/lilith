<div class="toolbar">
  <div class="btn-toolbar" role="toolbar" aria-label="Editor toolbar">
    <!-- Lilith: grouped like HackMD's toolbar (undo/redo, text, blocks, insert) -->
    <div class="btn-group" role="group">
      <a id="makeUndo" class="btn btn-sm" role="button" title="復原 (Ctrl+Z)" aria-label="復原">
          <i class="fa fa-undo fa-fw"></i>
      </a>
      <a id="makeRedo" class="btn btn-sm" role="button" title="重做 (Ctrl+Y)" aria-label="重做">
          <i class="fa fa-repeat fa-fw"></i>
      </a>
    </div>
    <div class="btn-group" role="group">
      <a id="makeBold" class="btn btn-sm text-uppercase" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="false" title="粗體">
          <i class="fa fa-bold fa-fw"></i>
      </a>
      <a id="makeItalic" class="btn btn-sm text-uppercase" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="false" title="斜體">
          <i class="fa fa-italic fa-fw"></i>
      </a>
      <a id="makeStrike" class="btn btn-sm text-uppercase" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="false" title="刪除線">
          <i class="fa fa-strikethrough fa-fw"></i>
      </a>
      <a id="makeHeader" class="btn btn-sm text-uppercase" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="false" title="標題">
          <i class="fa fa-h1 fa-fw">H</i>
      </a>
    </div>
    <div class="btn-group" role="group">
      <a id="makeCode" class="btn btn-sm text-uppercase" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="false" title="程式碼">
          <i class="fa fa-code fa-fw"></i>
      </a>
      <a id="makeQuote" class="btn btn-sm text-uppercase" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="false" title="引用">
          <i class="fa fa-quote-right fa-fw"></i>
      </a>
      <a id="makeGenericList" class="btn btn-sm text-uppercase" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="false" title="清單">
          <i class="fa fa-list fa-fw"></i>
      </a>
      <a id="makeOrderedList" class="btn btn-sm text-uppercase" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="false" title="編號清單">
          <i class="fa fa-list-ol fa-fw"></i>
      </a>
      <a id="makeCheckList" class="btn btn-sm text-uppercase" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="false" title="待辦清單">
          <i class="fa fa-check-square-o fa-fw"></i>
      </a>
    </div>
    <div class="btn-group" role="group">
      <a id="makeLink" class="btn btn-sm text-uppercase" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="false" title="連結">
          <i class="fa fa-link fa-fw"></i>
      </a>
      <a id="makeImage" class="btn btn-sm text-uppercase" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="false" title="圖片">
          <i class="fa fa-image fa-fw"></i>
      </a>
      <a id="uploadImage" class="btn btn-sm btn-file ui-upload-image" title="上傳圖片">
          <i class="fa fa-upload fa-fw"></i><input type="file" accept="image/*" name="upload" multiple title="上傳圖片">
      </a>
      <a id="makeTable" class="btn btn-sm text-uppercase" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="false" title="表格">
          <i class="fa fa-table fa-fw"></i>
      </a>
      <a id="makeLine" class="btn btn-sm text-uppercase" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="false" title="分隔線">
          <i class="fa fa-minus fa-fw"></i>
      </a>
      <a id="makeComment" class="btn btn-sm text-uppercase" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="false" title="註解">
          <i class="fa fa-comment-o fa-fw"></i>
      </a>
    </div>
  </div>
</div>
